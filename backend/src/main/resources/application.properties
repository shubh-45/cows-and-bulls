spring.application.name=cows-and-bulls

# Render (and most free hosts) inject the PORT env var - default to 8080 for local dev
server.port=${PORT:8080}

# Comma-separated list of origins allowed to call this API.
# Add your deployed frontend URL here once you deploy (see README).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# How long an idle game is kept in memory before it's cleaned up (minutes).
# Measured from the last guess, not from when the game started.
app.game.ttl-minutes=60
app.game.cleanup-interval-ms=300000

# Rooms are short-lived by nature - a game lasts minutes - so abandoned
# lobbies are swept sooner than games.
app.room.ttl-minutes=90
app.room.cleanup-interval-ms=300000
